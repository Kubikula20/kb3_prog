<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>První skript</title>
</head>
<body>
   <h2 id="vysledek"></h2>
    
    <script>
      let pi = 3.14;
    let polomer = Number (prompt("Zadej poloměr: "));
    let obsah = pi * polomer * polomer ;
      document.getElementById("vysledek").innerHTML
       ="Obsah: " + obsah; 
    </script>
</body>
</html>
