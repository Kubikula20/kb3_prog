<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyklus</title>
</head>
<body>
<h2 id = "vysledek"></h2>
<script>
let cislo = Number(prompt("Zadej číslo: "));
let soucet = 0;
for (let i = 1; i <= cislo; i++) {
    soucet = soucet + i;
}
document.getElementById("vysledek").innerHTML
= "Součet všech čísel menších jak " + cislo + " je " + soucet;
</script>
</body>
</html>
