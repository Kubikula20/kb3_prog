<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyšlo GTA 6?</title>
</head>
<body>
<h2 id = "vysledek"></h2>
<script>
let den = prompt("Zadej den: ");
let mesic = prompt("Zadej mesic: ");
let rok = prompt("Zadej rok: ");
if (den >= 19 && mesic >= 11 && rok >= 2026 ) {
    document.getElementById("vysledek").innerHTML
 = "GTA 6 vyšlo."
} else {
        document.getElementById("vysledek").innerHTML
 = "GTA 6 nevyšlo."
}
</script>
</body>
</html>
