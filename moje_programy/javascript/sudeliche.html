<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudé nebo liché</title>
</head>
<body>
    <h2 id="vysledek"></h2>
<script>
let cislo1 = Number(prompt("Zadej číslo: "));
if (cislo1 % 2 == 0) {
    document.getElementById("vysledek").innerHTML
    = "Číslo je sudé";
} else {
    document.getElementById("vysledek").innerHTML
    = "Číslo je liché";
}
</script>
</body>
</html>
